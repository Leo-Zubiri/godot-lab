justification: "get_tree().create_timer(1.0).timeout.connect(_on_timeout) is valid Godot 4 code. It is one-shot and runs from _ready(). The lifecycle claims check out: process_always defaults to true, so it ticks while paused. ignore_time_scale defaults to false, so it respects time_scale. The connection is dropped if the node is freed first. The only quibble is that 'frees itself' is loose wording for a RefCounted timer."
