justification: "`get_tree().create_timer(1.0).timeout.connect(_on_timeout, CONNECT_ONE_SHOT)` inside `_ready()` is valid Godot 4 GDScript. It calls `_on_timeout()` once after about 1 second, and the timer's `timeout` signal fires only once anyway. The lifecycle notes are accurate: `_ready` runs once after the node and its children enter the tree, and the SceneTree advances the timer each frame. The callback is deferred to a later frame, not run synchronously. Godot does drop signal connections when the receiving object is freed, so the early-free note is correct, though the answer hedges it as unverified. No invented APIs. The 'reference guide' and 'unverified notes' preamble is distracting and slightly lowers clarity."
